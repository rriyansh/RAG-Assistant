name: Build mobile releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and export
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_BACKEND_CONFIG_URL: ${{ vars.NEXT_PUBLIC_BACKEND_CONFIG_URL }}
        run: npm install && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: frontend/out/
          if-no-files-found: error

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: frontend/out
      - name: Add Capacitor Android and build APK
        working-directory: frontend
        run: npm install && npx cap add android && npx @capacitor/assets generate --android --iconBackgroundColor '#29263a' --splashBackgroundColor '#29263a' && npx cap sync android && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: resso-agent-android-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-unsigned:
    needs: web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: frontend/out
      - name: Add Capacitor iOS and build unsigned app
        working-directory: frontend
        run: npm install && npx cap add ios && npx @capacitor/assets generate --ios --iconBackgroundColor '#29263a' --splashBackgroundColor '#29263a' && npx cap sync ios && cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        working-directory: frontend/ios/App/build/Build/Products/Release-iphoneos
        run: mkdir -p Payload && cp -R App.app Payload/App.app && zip -qry "$GITHUB_WORKSPACE/resso-agent-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: resso-agent-ios-unsigned-ipa
          path: resso-agent-ios-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [android, ios-unsigned]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resso-agent-android-apk
          path: release
      - name: Rename APK
        run: mv release/app-debug.apk release/resso-agent-android.apk
      - uses: actions/download-artifact@v4
        with:
          name: resso-agent-ios-unsigned-ipa
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mobile-${{ github.run_number }}-${{ github.run_attempt }}
        run: gh release create "$TAG" release/resso-agent-android.apk release/resso-agent-ios-unsigned.ipa --repo "$GITHUB_REPOSITORY" --title "Resso Agent mobile $TAG" --latest --notes "Automated build for $GITHUB_SHA. The IPA is unsigned; installation requires signing with a valid iOS signing identity."

  ota:
    if: github.ref == 'refs/heads/main'
    needs: web
    env:
      CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: frontend/out
      - name: Publish Capgo production bundle
        if: ${{ env.CAPGO_TOKEN != '' }}
        working-directory: frontend
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: npx @capgo/cli@latest bundle upload --channel=production --apikey="$CAPGO_TOKEN" --path=out
