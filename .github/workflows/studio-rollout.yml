name: Studio tenant rollout checks
on:
  push:
    paths: ['src/api/studio*.py', 'scripts/*studio*', 'migrations/*', 'tests/studio_postgres_rollout.py', '.github/workflows/studio-rollout.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: disposable_ci
      PGDATABASE: postgres
      STUDIO_DATABASE_URL: postgresql://studio_ci:studio_ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "psycopg[binary]>=3.1,<4" "fastapi>=0.110,<1"
      - run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE studio_ci LOGIN PASSWORD 'studio_ci'"
          psql -v ON_ERROR_STOP=1 -f migrations/001_assistant_studio.sql
          psql -v ON_ERROR_STOP=1 -f migrations/002_studio_runtime.sql
          psql -v ON_ERROR_STOP=1 -v runtime_role=studio_ci -f scripts/studio_runtime_grants.sql
          PYTHONPATH=. python tests/studio_postgres_rollout.py
